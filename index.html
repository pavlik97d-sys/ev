<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>EV Статистика</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background: radial-gradient(circle at top, #0d233a 0%, #08111d 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card-glass {
      background: rgba(14, 30, 50, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.2);
    }
    .glow-cyan {
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.15);
    }
  </style>
</head>
<body class="text-white p-3.5 select-none min-h-screen pb-10">
  <script>window.Telegram.WebApp.expand();</script>

  <!-- Инфо-плашка -->
  <div class="card-glass rounded-2xl p-3 mb-3 flex items-center justify-between text-xs text-slate-300">
    <div>
      <span class="font-bold text-cyan-400">📊 Сводка обновлена:</span> <span id="sync-time">--:--</span>
      <div class="text-[11px] text-slate-400">⚡ Geely EX5 EM-i • 18.7 кВт⋅ч</div>
    </div>
    <span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 px-2 py-0.5 rounded-full text-[10px] font-bold">ONLINE</span>
  </div>

  <!-- Главные виджеты -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
    
    <!-- Круговой индикатор последней зарядки -->
    <div class="card-glass rounded-2xl p-4 flex flex-col items-center justify-between glow-cyan relative">
      <div class="text-xs uppercase font-bold tracking-wider text-cyan-400 flex items-center gap-1">
        📈 ОБЩАЯ СТАТИСТИКА
      </div>
      
      <div class="relative w-36 h-36 my-2 flex items-center justify-center">
        <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
          <path class="text-slate-800" stroke-width="3.5" stroke="currentColor" fill="none"
            d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
          <path id="circle-bar" class="text-emerald-400 transition-all duration-700" stroke-width="3.5" stroke-dasharray="0, 100" stroke-linecap="round" stroke="currentColor" fill="none"
            d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
        </svg>
        <div class="absolute flex flex-col items-center">
          <span id="soc-val" class="text-3xl font-black text-white">0%</span>
          <span class="text-[9px] text-slate-400">Залито в батарею</span>
        </div>
      </div>

      <div class="w-full text-center text-xs text-slate-300 border-t border-slate-800 pt-2">
        <div class="text-[11px] text-slate-400">Последняя зарядка:</div>
        <div id="last-charge-text" class="font-semibold text-emerald-400">Нет данных</div>
      </div>
    </div>

    <!-- График по дням недели -->
    <div class="card-glass rounded-2xl p-4 flex flex-col justify-between glow-cyan">
      <div class="flex justify-between items-start mb-2">
        <div>
          <div class="text-xs uppercase font-bold tracking-wider text-emerald-400">📊 ИСТОРИЯ ЗАВЕРШЕНИЙ</div>
          <div id="stat-summary" class="text-[11px] text-slate-300">0 кВт⋅ч / 0 км / 0 сессий</div>
        </div>
      </div>
      
      <div class="h-32 w-full">
        <canvas id="barChart"></canvas>
      </div>
    </div>
  </div>

  <!-- Статус авто -->
  <div class="card-glass rounded-2xl p-3.5 mb-3 border-emerald-500/30">
    <div class="flex items-center justify-between text-xs font-bold text-amber-400 mb-1.5">
      <div class="flex items-center gap-1.5">
        <span class="animate-pulse">⚡</span> Текущий статус авто
      </div>
      <span class="text-[10px] bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded">В паркинге</span>
    </div>
    <div class="text-xs text-slate-200">
      <strong>Geely EX5 EM-i</strong>: средний расход <span id="avg-cons" class="text-emerald-400 font-bold">0.0 кВт⋅ч/100км</span>
    </div>
    <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden mt-2">
      <div id="progress-bar" class="bg-gradient-to-r from-emerald-500 to-cyan-400 h-full w-[0%] transition-all duration-500"></div>
    </div>
  </div>

  <!-- Форма записи -->
  <div class="card-glass rounded-2xl p-4 mb-3 space-y-2.5">
    <div class="text-xs font-bold uppercase tracking-wider text-cyan-400">➕ Новая запись в журнал</div>
    <div class="grid grid-cols-2 gap-2">
      <input id="odo" type="number" placeholder="Пробег (км)" class="bg-slate-900/80 border border-slate-700 rounded-xl p-2 text-xs text-white outline-none focus:border-cyan-400">
      <input id="kwh" type="number" step="any" placeholder="Залито (кВт⋅ч)" class="bg-slate-900/80 border border-slate-700 rounded-xl p-2 text-xs text-white outline-none focus:border-cyan-400">
    </div>
    <input id="price" type="number" step="any" placeholder="Стоимость (₽)" class="w-full bg-slate-900/80 border border-slate-700 rounded-xl p-2 text-xs text-white outline-none focus:border-cyan-400">
    <button onclick="saveData()" class="w-full bg-gradient-to-r from-cyan-600 to-emerald-600 hover:opacity-90 active:scale-95 font-bold py-2.5 rounded-xl text-xs uppercase tracking-wider transition">
      💾 Записать данные
    </button>
  </div>

  <!-- Нижние кнопки быстрых действий -->
  <div class="grid grid-cols-4 gap-2 text-[11px] font-medium text-center">
    <button onclick="location.reload()" class="card-glass p-2 rounded-xl hover:bg-slate-800 flex flex-col items-center gap-1">
      🔄 <span>Обновить</span>
    </button>
    <button onclick="showReport()" class="card-glass p-2 rounded-xl hover:bg-slate-800 flex flex-col items-center gap-1">
      📈 <span>Отчеты</span>
    </button>
    <button onclick="Telegram.WebApp.showAlert('Ближайшие ЭЗС: 220В Домашняя (3.5 кВт) / Type 2 (7 кВт)')" class="card-glass p-2 rounded-xl hover:bg-slate-800 flex flex-col items-center gap-1">
      🗺 <span>Карта</span>
    </button>
    <button onclick="clearData()" class="card-glass p-2 rounded-xl hover:bg-slate-800 flex flex-col items-center gap-1 text-rose-400">
      ⚙️ <span>Сброс</span>
    </button>
  </div>

  <script>
    const BATTERY_CAP = 18.7; // Батарея Geely EX5 EM-i
    let db = JSON.parse(localStorage.getItem('ev_logs') || '[]');
    let chartInstance = null;

    function initChart() {
      const ctx = document.getElementById('barChart').getContext('2d');
      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'],
          datasets: [{
            data: [0, 0, 0, 0, 0, 0, 0],
            backgroundColor: 'rgba(52, 211, 153, 0.8)',
            borderRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false }, ticks: { color: '#94a3b8', font: { size: 9 } } },
            y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8', font: { size: 9 }, beginAtZero: true } }
          }
        }
      });
    }

    function render() {
      let totalKwh = 0;
      let totalCost = 0;
      let weekdayKwh = [0, 0, 0, 0, 0, 0, 0]; // Пн-Вс

      db.forEach(i => {
        const kwh = parseFloat(i.kwh || 0);
        totalKwh += kwh;
        totalCost += parseFloat(i.price || 0);
        
        if (i.date) {
          const d = new Date(i.date);
          const dayIdx = (d.getDay() + 6) % 7; // Понедельник = 0
          weekdayKwh[dayIdx] += kwh;
        }
      });

      // Динамический график
      if (chartInstance) {
        chartInstance.data.datasets[0].data = weekdayKwh;
        chartInstance.update();
      }

      // Расчет пробега и расхода
      let dist = 0;
      if (db.length >= 2) {
        dist = Math.max(...db.map(i => i.odo)) - Math.min(...db.map(i => i.odo));
        const avg = dist > 0 ? ((totalKwh / dist) * 100).toFixed(1) : '0.0';
        document.getElementById('avg-cons').innerText = `${avg} кВт⋅ч/100км`;
      } else {
        document.getElementById('avg-cons').innerText = `0.0 кВт⋅ч/100км`;
      }

      document.getElementById('stat-summary').innerText = `${totalKwh.toFixed(1)} кВт⋅ч / ${dist} км / ${db.length} сессий`;
      document.getElementById('sync-time').innerText = new Date().toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});

      // Динамический круг и последняя запись
      if (db.length > 0) {
        const last = db[db.length - 1];
        const percent = Math.min(100, Math.round((last.kwh / BATTERY_CAP) * 100));
        document.getElementById('soc-val').innerText = `${percent}%`;
        document.getElementById('circle-bar').setAttribute('stroke-dasharray', `${percent}, 100`);
        document.getElementById('last-charge-text').innerText = `🔋 +${last.kwh} кВт⋅ч (${last.price} ₽)`;
        document.getElementById('progress-bar').style.width = `${percent}%`;
      } else {
        document.getElementById('soc-val').innerText = `0%`;
        document.getElementById('circle-bar').setAttribute('stroke-dasharray', `0, 100`);
        document.getElementById('last-charge-text').innerText = `Нет данных`;
        document.getElementById('progress-bar').style.width = `0%`;
      }
    }

    function saveData() {
      const odo = document.getElementById('odo').value;
      const kwh = document.getElementById('kwh').value;
      const price = document.getElementById('price').value || 0;
      if (!odo || !kwh) {
        Telegram.WebApp.showAlert('Заполните пробег и кВт⋅ч!');
        return;
      }
      db.push({ odo: parseFloat(odo), kwh: parseFloat(kwh), price: parseFloat(price), date: new Date().toISOString() });
      localStorage.setItem('ev_logs', JSON.stringify(db));
      document.getElementById('odo').value = '';
      document.getElementById('kwh').value = '';
      document.getElementById('price').value = '';
      render();
      try { Telegram.WebApp.HapticFeedback.notificationOccurred('success'); } catch(e){}
    }

    function showReport() {
      let totalCost = db.reduce((acc, i) => acc + parseFloat(i.price || 0), 0);
      let totalKwh = db.reduce((acc, i) => acc + parseFloat(i.kwh || 0), 0);
      Telegram.WebApp.showAlert(`Всего сессий: ${db.length}\nЗалито энергии: ${totalKwh.toFixed(1)} кВт⋅ч\nПотрачено: ${Math.round(totalCost)} ₽`);
    }

    function clearData() {
      Telegram.WebApp.showConfirm('Вы действительно хотите полностью очистить всю историю?', function(confirmed) {
        if (confirmed) {
          localStorage.removeItem('ev_logs');
          db = [];
          render();
          Telegram.WebApp.showAlert('История успешно сброшена!');
        }
      });
    }

    initChart();
    render();
  </script>
</body>
</html>
