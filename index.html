<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>EV Статистика</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Библиотека генерации Excel на клиенте -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <style>
    body {
      background: #f0f4f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #1e293b;
    }
    .card-clean {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 20px -2px rgba(37, 99, 235, 0.06);
    }
    .accent-blue {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
    }
  </style>
</head>
<body class="p-3.5 select-none min-h-screen pb-10">
  <script>window.Telegram.WebApp.expand();</script>

  <!-- Инфо-плашка -->
  <div class="card-clean rounded-2xl p-3 mb-3 flex items-center justify-between text-xs text-slate-500">
    <div>
      <span class="font-bold text-blue-600">📊 Сводка обновлена:</span> <span id="sync-time" class="text-slate-700">--:--</span>
      <div class="text-[11px] text-slate-400">⚡ Geely EX5 EM-i • 18.7 кВт⋅ч</div>
    </div>
    <span class="bg-blue-50 text-blue-600 border border-blue-200 px-2 py-0.5 rounded-full text-[10px] font-bold tracking-wider">ONLINE</span>
  </div>

  <!-- Главные виджеты -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
    
    <!-- Левый виджет: Круговой индикатор -->
    <div class="card-clean rounded-2xl p-4 flex flex-col items-center justify-between relative">
      <div class="text-xs uppercase font-bold tracking-wider text-blue-600 flex items-center gap-1">
        📈 ОБЩАЯ СТАТИСТИКА
      </div>
      
      <div class="relative w-36 h-36 my-2 flex items-center justify-center">
        <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
          <path class="text-slate-100" stroke-width="3.5" stroke="currentColor" fill="none"
            d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
          <path id="circle-bar" class="text-blue-600 transition-all duration-700" stroke-width="3.5" stroke-dasharray="0, 100" stroke-linecap="round" stroke="currentColor" fill="none"
            d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
        </svg>
        <div class="absolute flex flex-col items-center">
          <span id="soc-val" class="text-3xl font-black text-slate-800">0%</span>
          <span class="text-[9px] text-slate-400">Объем заряда</span>
        </div>
      </div>

      <div class="w-full text-center text-xs text-slate-600 border-t border-slate-100 pt-2">
        <div class="text-[11px] text-slate-400">Последняя сессия:</div>
        <div id="last-charge-text" class="font-bold text-blue-600">Нет данных</div>
      </div>
    </div>

    <!-- Правый виджет: График по дням недели -->
    <div class="card-clean rounded-2xl p-4 flex flex-col justify-between">
      <div class="flex justify-between items-start mb-2">
        <div>
          <div class="text-xs uppercase font-bold tracking-wider text-slate-700">📊 ИСТОРИЯ СЕССИЙ</div>
          <div id="stat-summary" class="text-[11px] text-slate-500">0 кВт⋅ч / 0 км / 0 сессий</div>
        </div>
      </div>
      
      <div class="h-32 w-full">
        <canvas id="barChart"></canvas>
      </div>
    </div>
  </div>

  <!-- Статус авто -->
  <div class="card-clean rounded-2xl p-3.5 mb-3 border-blue-100 bg-gradient-to-r from-blue-50/50 to-white">
    <div class="flex items-center justify-between text-xs font-bold text-blue-700 mb-1.5">
      <div class="flex items-center gap-1.5">
        <span>⚡</span> Средняя энергоэффективность
      </div>
      <span class="text-[10px] bg-white text-blue-700 border border-blue-200 px-2 py-0.5 rounded shadow-sm">Geely EX5</span>
    </div>
    <div class="text-xs text-slate-600">
      Средний расход: <span id="avg-cons" class="text-blue-700 font-bold">0.0 кВт⋅ч/100км</span>
    </div>
    <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden mt-2">
      <div id="progress-bar" class="accent-blue h-full w-[0%] transition-all duration-500"></div>
    </div>
  </div>

  <!-- Форма записи -->
  <div class="card-clean rounded-2xl p-4 mb-3 space-y-2.5">
    <div class="text-xs font-bold uppercase tracking-wider text-blue-600">➕ Новая зарядная сессия</div>
    <div class="grid grid-cols-2 gap-2">
      <input id="odo" type="number" onfocus="haptic('light')" placeholder="Текущий одометр (км)" class="bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs text-slate-800 outline-none focus:border-blue-500 focus:bg-white transition">
      <input id="kwh" type="number" step="any" onfocus="haptic('light')" placeholder="Заряжено (кВт⋅ч)" class="bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs text-slate-800 outline-none focus:border-blue-500 focus:bg-white transition">
    </div>
    <input id="price" type="number" step="any" onfocus="haptic('light')" placeholder="Стоимость зарядки (₽)" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs text-slate-800 outline-none focus:border-blue-500 focus:bg-white transition">
    <button onclick="saveData()" class="w-full accent-blue text-white hover:opacity-95 active:scale-[0.98] font-bold py-3 rounded-xl text-xs uppercase tracking-wider transition shadow-md shadow-blue-500/20">
      💾 Сохранить сессию
    </button>
  </div>

  <!-- Нижняя панель действий -->
  <div class="grid grid-cols-4 gap-2 text-[11px] font-medium text-center">
    <button onclick="haptic('medium'); location.reload();" class="card-clean p-2.5 rounded-xl hover:bg-slate-50 active:scale-95 transition flex flex-col items-center gap-1 text-slate-600">
      🔄 <span>Обновить</span>
    </button>
    <button onclick="exportToExcel()" class="card-clean p-2.5 rounded-xl hover:bg-slate-50 active:scale-95 transition flex flex-col items-center gap-1 text-blue-600">
      📊 <span>Экспорт</span>
    </button>
    <button onclick="showReport()" class="card-clean p-2.5 rounded-xl hover:bg-slate-50 active:scale-95 transition flex flex-col items-center gap-1 text-slate-600">
      📈 <span>Отчеты</span>
    </button>
    <button onclick="clearData()" class="card-clean p-2.5 rounded-xl hover:bg-rose-50 active:scale-95 transition flex flex-col items-center gap-1 text-rose-500">
      ⚙️ <span>Сброс</span>
    </button>
  </div>

  <script>
    const BATTERY_CAP = 18.7;
    let db = JSON.parse(localStorage.getItem('ev_logs') || '[]');
    let chartInstance = null;

    function haptic(type) {
      try {
        if (type === 'light') Telegram.WebApp.HapticFeedback.impactOccurred('light');
        if (type === 'medium') Telegram.WebApp.HapticFeedback.impactOccurred('medium');
        if (type === 'success') Telegram.WebApp.HapticFeedback.notificationOccurred('success');
        if (type === 'warning') Telegram.WebApp.HapticFeedback.notificationOccurred('warning');
      } catch(e){}
    }

    function initChart() {
      const ctx = document.getElementById('barChart').getContext('2d');
      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'],
          datasets: [{
            data: [0, 0, 0, 0, 0, 0, 0],
            backgroundColor: '#2563eb',
            borderRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false }, ticks: { color: '#64748b', font: { size: 9 } } },
            y: { grid: { color: '#f1f5f9' }, ticks: { color: '#64748b', font: { size: 9 } }, beginAtZero: true }
          }
        }
      });
    }

    function render() {
      let totalKwh = 0;
      let totalCost = 0;
      let weekdayKwh = [0, 0, 0, 0, 0, 0, 0];

      db.forEach(i => {
        const kwh = parseFloat(i.kwh || 0);
        totalKwh += kwh;
        totalCost += parseFloat(i.price || 0);
        
        if (i.date) {
          const d = new Date(i.date);
          const dayIdx = (d.getDay() + 6) % 7;
          weekdayKwh[dayIdx] += kwh;
        }
      });

      if (chartInstance) {
        chartInstance.data.datasets[0].data = weekdayKwh;
        chartInstance.update();
      }

      let dist = 0;
      if (db.length >= 2) {
        dist = Math.max(...db.map(i => i.odo)) - Math.min(...db.map(i => i.odo));
        const avg = dist > 0 ? ((totalKwh / dist) * 100).toFixed(1) : '0.0';
        document.getElementById('avg-cons').innerText = `${avg} кВт⋅ч/100км`;
      } else {
        document.getElementById('avg-cons').innerText = `0.0 кВт⋅ч/100км`;
      }

      document.getElementById('stat-summary').innerText = `${totalKwh.toFixed(1)} кВт⋅ч / ${dist} км / ${db.length} сессий`;
      document.getElementById('sync-time').innerText = new Date().toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});

      if (db.length > 0) {
        const last = db[db.length - 1];
        const percent = Math.min(100, Math.round((last.kwh / BATTERY_CAP) * 100));
        document.getElementById('soc-val').innerText = `${percent}%`;
        document.getElementById('circle-bar').setAttribute('stroke-dasharray', `${percent}, 100`);
        document.getElementById('last-charge-text').innerText = `🔋 +${last.kwh} кВт⋅ч (${last.price} ₽)`;
        document.getElementById('progress-bar').style.width = `${percent}%`;
      } else {
        document.getElementById('soc-val').innerText = `0%`;
        document.getElementById('circle-bar').setAttribute('stroke-dasharray', `0, 100`);
        document.getElementById('last-charge-text').innerText = `Нет данных`;
        document.getElementById('progress-bar').style.width = `0%`;
      }
    }

    function saveData() {
      const odo = document.getElementById('odo').value;
      const kwh = document.getElementById('kwh').value;
      const price = document.getElementById('price').value || 0;
      if (!odo || !kwh) {
        haptic('warning');
        Telegram.WebApp.showAlert('Заполните одометр и объем заряда в кВт⋅ч!');
        return;
      }
      db.push({ odo: parseFloat(odo), kwh: parseFloat(kwh), price: parseFloat(price), date: new Date().toISOString() });
      localStorage.setItem('ev_logs', JSON.stringify(db));
      document.getElementById('odo').value = '';
      document.getElementById('kwh').value = '';
      document.getElementById('price').value = '';
      haptic('success');
      render();
    }

    function showReport() {
      haptic('light');
      let totalCost = db.reduce((acc, i) => acc + parseFloat(i.price || 0), 0);
      let totalKwh = db.reduce((acc, i) => acc + parseFloat(i.kwh || 0), 0);
      Telegram.WebApp.showAlert(`Всего сессий: ${db.length}\nПринято энергии: ${totalKwh.toFixed(1)} кВт⋅ч\nЗатраты: ${Math.round(totalCost)} ₽`);
    }

    function exportToExcel() {
      haptic('medium');
      if (!db || db.length === 0) {
        Telegram.WebApp.showAlert('История пуста. Сначала добавьте хотя бы одну запись.');
        return;
      }

      try {
        // Подготовка строк таблицы
        const rows = db.map((item, idx) => {
          const d = new Date(item.date);
          return {
            "№": idx + 1,
            "Дата": d.toLocaleDateString('ru-RU'),
            "Время": d.toLocaleTimeString('ru-RU', {hour: '2-digit', minute: '2-digit'}),
            "Одометр (км)": Number(item.odo),
            "Заряжено (кВт⋅ч)": Number(item.kwh),
            "Стоимость (₽)": Number(item.price)
          };
        });

        const ws = XLSX.utils.json_to_sheet(rows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Журнал зарядок");

        // Прямое скачивание xlsx файла
        XLSX.writeFile(wb, `EV_Garage_Geely_EX5_${new Date().toISOString().slice(0,10)}.xlsx`);
        haptic('success');
      } catch (err) {
        Telegram.WebApp.showAlert('Ошибка при экспорте: ' + err.message);
      }
    }

    function clearData() {
      haptic('warning');
      Telegram.WebApp.showConfirm('Вы действительно хотите полностью очистить всю историю сессий?', function(confirmed) {
        if (confirmed) {
          localStorage.removeItem('ev_logs');
          db = [];
          render();
          haptic('success');
          Telegram.WebApp.showAlert('История очищена.');
        }
      });
    }

    initChart();
    render();
  </script>
</body>
</html>
